name: Publish Maven Central

run-name: >
  ${{ startsWith(github.ref, 'refs/tags/') && format('Publish release `{0}`', github.ref_name) }}

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: ArchBoot
    uses: ArchBoot/reusables-worklows/.github/workflows/reusable-publish-maven-central.yml@main
    secrets: inherit