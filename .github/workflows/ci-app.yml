name: CI APP

run-name: >
  ${{ startsWith(github.ref, 'refs/tags/') && format('Release `{0}`', github.ref_name) || format('Analyse `{0}`', github.sha) }}
  
on:
  push:
    branches:
      - main
      - develop
      - bugfix/*
      - hotfix/*
      - feature/*
  pull_request:
    branches:
      - develop
      - release/*
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  checks: write
  contents: read
  id-token: write
  statuses: write
  pull-requests: read

jobs:
  ci:
    name: ArchBoot
    uses: ArchBoot/reusables-worklows/.github/workflows/reusable-ci.yml@main
    secrets: inherit